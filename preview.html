<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>실행연구소 · 프론트 미리보기</title>
<style>
  :root{
    --bar-bg:#ffffff; --bar-line:#e5e7eb; --ink:#0f172a; --muted:#64748b;
    --btn-bg:#ffffff; --btn-line:#d7dce3; --btn-hover:#f1f5f9;
    --accent:#2563eb; --accent-ink:#ffffff; --stage:#e6e8ec; --frame-line:#cbd2db;
    --group-label:#94a3b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    color:var(--ink);background:var(--stage);display:flex;flex-direction:column;overflow:hidden}

  /* ===== 상단 툴바 ===== */
  .bar{flex:0 0 auto;background:var(--bar-bg);border-bottom:1px solid var(--bar-line);
    display:flex;align-items:center;gap:14px;padding:9px 16px;flex-wrap:wrap;
    box-shadow:0 1px 0 rgba(15,23,42,.02),0 6px 18px -12px rgba(15,23,42,.25);z-index:10}
  .brand{display:flex;flex-direction:column;line-height:1.15;margin-right:4px;user-select:none}
  .brand b{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .brand span{font-size:11px;color:var(--muted)}
  .group{display:flex;align-items:center;gap:6px}
  .group>.lbl{font-size:11px;font-weight:700;color:var(--group-label);letter-spacing:.02em;margin-right:2px}
  .seg{display:inline-flex;gap:4px;background:#f4f6f9;border:1px solid var(--bar-line);border-radius:11px;padding:3px}
  .btn{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink);
    font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;
    transition:background .14s ease,color .14s ease,border-color .14s ease;white-space:nowrap;line-height:1}
  .seg .btn:hover{background:#fff}
  .seg .btn.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(37,99,235,.35)}
  .btn.solo{border:1px solid var(--btn-line);background:var(--btn-bg)}
  .btn.solo:hover{background:var(--btn-hover)}
  .btn.solo.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .win{display:inline-flex;align-items:center;gap:6px}
  .wnum{width:78px;padding:6px 9px;border:1px solid var(--btn-line);border-radius:8px;font:inherit;font-size:13px;
    font-weight:600;text-align:right;color:var(--ink);background:#fff}
  .wnum:focus{outline:2px solid rgba(37,99,235,.35);outline-offset:1px;border-color:var(--accent)}
  .unit{font-size:12px;color:var(--muted);font-weight:600}
  .spacer{flex:1 1 auto;min-width:8px}
  .status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .status b{color:var(--ink);font-weight:800}
  .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  .sep{width:1px;height:26px;background:var(--bar-line);margin:0 2px}

  /* ===== 미리보기 무대 ===== */
  .stage{flex:1 1 auto;position:relative;overflow:auto;display:grid;place-items:start center;padding:26px}
  .stage.center{place-items:center}
  .sizer{position:relative}
  .frame{position:absolute;top:0;left:0;transform-origin:top left;background:#fff;
    border:1px solid var(--frame-line);border-radius:14px;overflow:hidden;
    box-shadow:0 24px 60px -24px rgba(15,23,42,.45),0 6px 18px -12px rgba(15,23,42,.3)}
  .frame iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  .empty{color:var(--muted);font-size:13px;padding:40px}

  @media(max-width:820px){ .brand,.group>.lbl{display:none} .bar{gap:8px;padding:8px 10px} }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="brand"><b>실행연구소</b><span>프론트 미리보기</span></div>

    <div class="group">
      <span class="lbl">페이지</span>
      <div class="seg" id="pages"></div>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="lbl">화면</span>
      <div class="seg" id="devices"></div>
    </div>

    <div class="win">
      <input class="wnum" id="wnum" type="number" min="280" max="3840" step="1" value="1440" />
      <span class="unit">px</span>
      <button class="btn solo" id="apply">적용</button>
      <button class="btn solo" id="fit">맞춤 보기</button>
    </div>

    <div class="spacer"></div>

    <div class="status"><span class="dot"></span><span id="stat"><b>메인</b> · 1440px</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="sizer" id="sizer">
      <div class="frame" id="frame"><iframe id="ifr" title="preview" src="index.html"></iframe></div>
    </div>
  </div>

<script>
(function(){
  var PAGES = [
    {id:'index.html',       label:'메인'},
    {id:'인물1_index.html', label:'인물1'},
    {id:'저장1_index.html', label:'저장1'}
  ];
  var DEVICES = [
    {id:'desktop', label:'데스크톱', w:1440, h:900},
    {id:'tablet',  label:'태블릿',   w:768,  h:1024},
    {id:'mobile',  label:'모바일',   w:390,  h:844}
  ];

  var state = { page:'index.html', label:'메인', w:1440, h:900, dev:'desktop', fit:false };

  var elPages=document.getElementById('pages'), elDevs=document.getElementById('devices');
  var wnum=document.getElementById('wnum'), applyBtn=document.getElementById('apply'), fitBtn=document.getElementById('fit');
  var stage=document.getElementById('stage'), sizer=document.getElementById('sizer'),
      frame=document.getElementById('frame'), ifr=document.getElementById('ifr'), stat=document.getElementById('stat');

  // 페이지 버튼
  PAGES.forEach(function(p){
    var b=document.createElement('button'); b.className='btn'+(p.id===state.page?' on':''); b.textContent=p.label; b.dataset.id=p.id; b.dataset.label=p.label;
    b.addEventListener('click',function(){
      if(state.page===p.id) return;
      state.page=p.id; state.label=p.label;
      ifr.src=encodeURI(p.id);
      [].forEach.call(elPages.children,function(x){x.classList.toggle('on',x.dataset.id===p.id);});
      render();
    });
    elPages.appendChild(b);
  });

  // 기기 버튼
  DEVICES.forEach(function(d){
    var b=document.createElement('button'); b.className='btn'+(d.id===state.dev?' on':''); b.textContent=d.label; b.dataset.id=d.id;
    b.addEventListener('click',function(){
      state.dev=d.id; state.w=d.w; state.h=d.h; wnum.value=d.w;
      [].forEach.call(elDevs.children,function(x){x.classList.toggle('on',x.dataset.id===d.id);});
      render();
    });
    elDevs.appendChild(b);
  });

  function applyWidth(){
    var v=Math.max(280,Math.min(3840, parseInt(wnum.value,10)||state.w));
    wnum.value=v; state.w=v;
    // 폭에 맞는 기기 프리셋 자동 하이라이트 + 화면 높이 추정
    var match=DEVICES.filter(function(d){return d.w===v;})[0];
    state.dev = match?match.id:'custom';
    state.h = match?match.h:(v<=520?844:(v<=900?1024:900));
    [].forEach.call(elDevs.children,function(x){x.classList.toggle('on',x.dataset.id===state.dev);});
    render();
  }
  applyBtn.addEventListener('click',applyWidth);
  wnum.addEventListener('keydown',function(e){ if(e.key==='Enter') applyWidth(); });

  fitBtn.addEventListener('click',function(){
    state.fit=!state.fit;
    fitBtn.classList.toggle('on',state.fit);
    render();
  });

  function render(){
    var pad=52;                                   // stage 여유(스크롤 여백)
    var availW=Math.max(200, stage.clientWidth - pad);
    var availH=Math.max(200, stage.clientHeight - pad);
    var W=state.w, H=state.h;
    var scale = state.fit ? Math.min(1, availW/W, availH/H) : 1;

    frame.style.width=W+'px';
    frame.style.height=H+'px';
    frame.style.transform='scale('+scale+')';
    sizer.style.width=(W*scale)+'px';
    sizer.style.height=(H*scale)+'px';

    // 맞춤 보기(전체가 화면에 들어옴)면 가운데 정렬, 아니면 위쪽 정렬(세로 스크롤)
    stage.classList.toggle('center', state.fit);

    var pct=Math.round(scale*100);
    stat.innerHTML='<b>'+state.label+'</b> · '+W+'×'+H+'px'+(scale<1?'  ('+pct+'%)':'');
  }

  window.addEventListener('resize',render);
  render();
})();
</script>
</body>
</html>
